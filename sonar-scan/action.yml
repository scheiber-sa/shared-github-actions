name: "Run Sonar Scan"
description: "Run Sonarqube code quality scan using Scanwise"
inputs:
  sonar-source-path:
    description: "Path to the source code for Sonar scan"
    required: false
    default: "src"
  reports-scopes:
    description: "JSON array of report scopes"
    required: false
    default: '["overall"]'
  reports-extensions:
    description: "JSON array of report file extensions"
    required: false
    default: '["html"]'
  reports-retention-days:
    description: "Number of days to retain reports"
    required: false
    default: "7"
  new-code-n-days:
    description: "Period for new code analysis"
    required: false
    default: "3d"
  coverage-artifact:
    description: "Name of the coverage artifact to download. When set, the artifact is downloaded to /tmp/coverage/ and restored into the workspace before scanning."
    required: false
    default: ""

runs:
  using: "composite"

  steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download coverage artifact
      if: ${{ inputs.coverage-artifact != '' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.coverage-artifact }}
        path: /tmp/coverage/

    - name: Run Scanwise Sonar Scan
      uses: VIDADv1/scanwise@v1
      with:
        sonar-source-path: ${{ inputs.sonar-source-path }}
        reports-scopes: ${{ inputs.reports-scopes }}
        reports-extensions: ${{ inputs.reports-extensions }}
        reports-retention-days: ${{ inputs.reports-retention-days }}
        new-code-n-days: ${{ inputs.new-code-n-days }}
        pre-scan-script: |
          if [ -f "/tmp/coverage/lcov.info" ]; then
            echo "📥 Restoring coverage from /tmp/coverage after git clean..."
            mkdir -p coverage
            cp /tmp/coverage/lcov.info coverage/lcov.info
            echo ""
            echo "📁 Coverage restored:"
            ls -lh coverage/
            echo ""
            echo "✅ Coverage file ready for scanning"
            echo "📊 File size: $(du -h coverage/lcov.info | cut -f1)"
            echo "📄 Source files: $(grep -c '^SF:' coverage/lcov.info || echo 0)"
          fi
