name: 'npm install'
description: 'Sets up Node.js and installs npm dependencies with private package registry'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: 'latest'
  github-token:
    description: 'GitHub token for accessing private packages. When provided, configures npm for the @scheiber-sa registry.'
    required: false
  registry-url:
    description: 'Registry URL to pass to actions/setup-node'
    required: false
  scope:
    description: 'npm scope to pass to actions/setup-node'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Configure npm for private packages
      if: ${{ inputs.github-token != '' }}
      shell: bash
      run: |
        echo "@scheiber-sa:registry=https://npm.pkg.github.com" >> ~/.npmrc
        echo "//npm.pkg.github.com/:_authToken=${{ inputs.github-token }}" >> ~/.npmrc

    - name: Install dependencies
      shell: bash
      run: npm ci
