name: Publish Package to GitHub Packages

on:
  workflow_call:
    inputs:
      node_version:
        description: "The Node.js version to use"
        required: false
        default: "24"
        type: string
      scope:
        description: "The npm scope for the package (e.g. @your-org)"
        required: true
        type: string
      working_directory:
        description: "The working directory from which to publish"
        required: false
        default: "dist"
        type: string
      install_command:
        description: "The command to install dependencies"
        required: false
        default: "npm ci"
        type: string
      build_command:
        description: "The command to build the library"
        required: false
        default: "npm run build"
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: "https://npm.pkg.github.com"
          scope: ${{ inputs.scope }}

      - name: Install dependencies
        run: ${{ inputs.install_command }}

      - name: Build library
        run: ${{ inputs.build_command }}

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        working-directory: ${{ inputs.working_directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
