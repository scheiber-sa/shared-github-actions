name: 'Set canary version'
description: 'Generates a canary prerelease version from the current package version and commit SHA, and sets it in package.json'

outputs:
  canary-version:
    description: 'The generated canary version string (e.g. 1.0.9-canary.abc1234)'
    value: ${{ steps.set-version.outputs.canary-version }}

runs:
  using: 'composite'
  steps:
    - name: Set canary version
      id: set-version
      shell: bash
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        CANARY_VERSION="${CURRENT_VERSION}-canary.${SHORT_SHA}"
        npm version "$CANARY_VERSION" --no-git-tag-version
        echo "canary-version=$CANARY_VERSION" >> $GITHUB_OUTPUT
        echo "CANARY_VERSION=$CANARY_VERSION" >> $GITHUB_ENV
